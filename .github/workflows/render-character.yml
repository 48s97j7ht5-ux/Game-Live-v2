name: Render character

on:
  workflow_dispatch:
    inputs:
      yaw:
        description: "Поворот персонажа по вертикали (0 / 90 / 180 / 270)"
        required: false
        default: "0"
  push:
    paths:
      - factory/blender/**
      - factory/pixelize.py
      - .github/workflows/render-character.yml

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BLENDER_VERSION: 4.2.8
      YAW: ${{ github.event.inputs.yaw || '0' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Pillow
        run: python3 -m pip install --user pillow

      - name: Download Blender
        run: |
          set -euo pipefail
          curl -L --fail -o blender.tar.xz \
            "https://download.blender.org/release/Blender${BLENDER_VERSION%.*}/blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          mkdir -p "$HOME/blender"
          tar -xJf blender.tar.xz -C "$HOME/blender" --strip-components=1
          echo "$HOME/blender" >> "$GITHUB_PATH"

      - name: Download Michelle character
        run: |
          set -euo pipefail
          mkdir -p factory/models
          curl -L --fail -o factory/models/michelle.glb \
            "https://github.com/mrdoob/three.js/raw/r170/examples/models/gltf/Michelle.glb"
          ls -la factory/models/michelle.glb

      - name: Render character
        run: |
          blender --background --python factory/blender/render_character.py -- \
            --out factory/out/render.png \
            --model factory/models/michelle.glb \
            --yaw "$YAW"

      - name: Pixelize
        run: python3 factory/pixelize.py --src factory/out/render.png --dst factory/out/front.png

      - uses: actions/upload-artifact@v4
        with:
          name: character
          path: |
            factory/out/front.png
            factory/out/render.png

      - name: Commit preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add factory/out/front.png
          if git diff --cached --quiet; then
            echo "No preview changes"
            exit 0
          fi
          git commit -m "Update factory front preview."
          git push
