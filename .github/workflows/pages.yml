name: pages

on:
  push:
    branches: [main, cursor/character-factory-v0-a4d4]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        run: |
          set -euo pipefail
          mkdir -p dist/models dist/factory/out
          cp index.html dist/
          cp .nojekyll dist/
          cp -a web dist/web
          if [ -f models/base.obj ]; then
            cp models/base.obj dist/models/base.obj
          else
            curl -L --fail -o dist/models/base.obj \
              "https://raw.githubusercontent.com/48s97j7ht5-ux/Game-Live-Web/main/engine/anny/mpfb2/3dobjs/base.obj"
          fi
          test -f dist/web/chest-morph.js
          test -f dist/web/data/body-targets.json
          test -f dist/web/vendor/three.module.js
          test -f dist/web/vendor/loaders/OBJLoader.js
          if [ -f factory/out/front.png ]; then
            cp factory/out/front.png dist/factory/out/front.png
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
