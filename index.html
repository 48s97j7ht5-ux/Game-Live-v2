<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0d11">
  <title>Станок · болванка</title>
  <link rel="stylesheet" href="web/viewer.css?v=c40">
</head>
<body>
  <header class="bar">
    <div class="title">
      <strong>Станок</strong>
      <span id="status">гружу тело…</span>
    </div>
    <div class="tools">
      <label class="pixel-toggle" id="pixelToggle">
        <input type="checkbox" id="pixelMode">
        пиксель
      </label>
      <nav class="bodies" id="bodies" aria-label="Болванка"></nav>
      <nav class="variants" id="variants" hidden aria-label="Библиотека"></nav>
      <nav class="heights" id="heights">
        <button type="button" data-height="400">400</button>
        <button type="button" data-height="300">300</button>
      </nav>
    </div>
  </header>
  <div class="stage">
    <canvas id="view"></canvas>
    <aside class="side left" id="sideLeft" aria-label="Слева"></aside>
    <aside class="side right" id="sideRight" aria-label="Справа"></aside>
  </div>
  <nav class="bar bottom" id="turnBar">
    <button type="button" id="turnLeft" aria-label="Повернуть влево">←</button>
    <span id="turnLabel">перед</span>
    <button type="button" id="turnRight" aria-label="Повернуть вправо">→</button>
  </nav>
  <script type="importmap">
  {
    "imports": {
      "three": "./web/vendor/three.module.js",
      "three/addons/": "./web/vendor/"
    }
  }
  </script>
  <script type="module" src="web/viewer.js?v=c40"></script>
</body>
</html>
